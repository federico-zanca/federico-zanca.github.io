<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">One ticket moving through the kitchen scheduler</title>
  <desc id="desc">Placing a ticket starts its coroutine, which waits for confirmation. Confirming it queues its handle. The first kitchen update resumes it until it waits on a grilling timer. The second update advances the clock, queues the due timer, and resumes the coroutine to completion.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#9ed4c7"/></marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#e8b28d"/></marker>
  </defs>

  <rect width="820" height="500" fill="#1d252c"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <g fill="#334149" stroke="#627681" stroke-width="1.4">
      <rect x="24" y="20" width="160" height="38" rx="5"/>
      <rect x="284" y="20" width="252" height="38" rx="5"/>
      <rect x="636" y="20" width="160" height="38" rx="5"/>
    </g>
    <g fill="#f0efec" font-size="16" dominant-baseline="middle">
      <text x="104" y="39">Customer</text>
      <text x="410" y="39">Scheduler</text>
      <text x="716" y="39">Ticket coroutine</text>
    </g>
  </g>

  <g stroke="#485b65" stroke-width="1.5" stroke-dasharray="3 6">
    <path d="M104 65V474 M410 65V474 M716 65V474"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="2" marker-end="url(#arrow-teal)">
    <path d="M184 108H626" stroke="#9ed4c7"/>
    <path d="M184 203H274" stroke="#9ed4c7"/>
    <path d="M184 294H274" stroke="#9ed4c7"/>
    <path d="M536 294H626" stroke="#9ed4c7"/>
    <path d="M184 428H274" stroke="#9ed4c7"/>
    <path d="M536 428H626" stroke="#9ed4c7"/>
  </g>
  <path d="M636 357H546" fill="none" stroke="#e8b28d" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <g font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">
    <g fill="#c7e6df">
      <text x="410" y="96">create and first resume()</text>
      <text x="234" y="190">signal()</text>
      <text x="586" y="282">resume()</text>
      <text x="586" y="416">resume()</text>
    </g>
    <text x="586" y="345" fill="#f0c9aa">after(grill time)</text>
  </g>

  <g fill="#2b3840" stroke="#60727b" stroke-width="1.3">
    <rect x="24" y="87" width="160" height="42" rx="5"/>
    <rect x="636" y="80" width="160" height="56" rx="5"/>
    <rect x="24" y="182" width="160" height="42" rx="5"/>
    <rect x="284" y="177" width="252" height="52" rx="5"/>
    <rect x="24" y="273" width="160" height="42" rx="5"/>
    <rect x="284" y="268" width="252" height="52" rx="5"/>
    <rect x="636" y="266" width="160" height="56" rx="5"/>
    <rect x="284" y="334" width="252" height="46" rx="5"/>
    <rect x="24" y="407" width="160" height="42" rx="5"/>
    <rect x="284" y="399" width="252" height="58" rx="5"/>
    <rect x="636" y="400" width="160" height="56" rx="5"/>
  </g>

  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" dominant-baseline="middle">
    <g fill="#f0efec" font-size="15">
      <text x="104" y="108">Place</text>
      <text x="104" y="203">Confirm</text>
      <text x="104" y="294">Kitchen update</text>
      <text x="104" y="428">Kitchen update</text>
      <text x="410" y="195">ready_ ← handle</text>
      <text x="410" y="286">pop one from ready_</text>
      <text x="410" y="357">timers_ ← (due, handle)</text>
      <text x="410" y="418">clock → due timers → ready_</text>
      <text x="410" y="439">pop one handle</text>
      <text x="716" y="99">AwaitEvent</text>
      <text x="716" y="285">WaitForUpdate</text>
      <text x="716" y="419">Ready</text>
    </g>
    <g fill="#b9c6cb" font-size="13">
      <text x="716" y="120">draft · suspended</text>
      <text x="410" y="216">queued</text>
      <text x="716" y="306">grilling · suspended</text>
      <text x="716" y="441">frame destroyed</text>
    </g>
  </g>
</svg>
