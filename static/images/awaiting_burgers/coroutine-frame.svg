<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 294" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative coroutine frame</title>
  <desc id="desc">A schematic frame with separate rows for the resume pointer, destroy pointer, promise, coroutine index, copied parameters, saved locals, and optional awaiter state. The bands are not to scale and their order is not fixed by C++.</desc>
  <rect x="1" y="1" width="518" height="292" fill="#c7e2ff" stroke="#246ad3" stroke-width="2"/>
  <rect x="2" y="2" width="516" height="82" fill="#8ec0fb"/>
  <path d="M2 84 H518 V126 H2 Z M2 168 H518 V210 H2 Z M2 252 H518 V292 H2 Z" fill="#a5d2ff"/>
  <g fill="none" stroke="#246ad3" stroke-width="1.5">
    <path d="M1 42 H519 M1 84 H519 M1 126 H519 M1 168 H519 M1 210 H519 M1 252 H519"/>
  </g>
  <g fill="#14243a" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">
    <text x="260" y="22">resume ptr</text>
    <text x="260" y="64">destroy ptr</text>
    <text x="260" y="106">promise</text>
    <text x="260" y="148">coroutine index</text>
    <text x="260" y="190">parameters</text>
    <text x="260" y="232">saved locals</text>
    <text x="260" y="274">awaiter state</text>
  </g>
</svg>
