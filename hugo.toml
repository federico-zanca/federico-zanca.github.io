baseURL = 'https://federico-zanca.github.io/'
locale = 'en-us'
title = 'Federico Zanca'
theme = 'research'
enableRobotsTXT = true

[params]
  description = 'Notes on systems, security, and kernel internals.'
  article_style = 'reader'
  palette = 'violet'
  fonts = 'auto'
  sidebar = true
  toc = true
  numbered = true

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.parser.attribute]
  block = true
[markup.highlight]
  noClasses = false
  lineNos = true
  lineNumbersInTable = false
  tabWidth = 4
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = true

[outputs]
  home = ['HTML', 'RSS']
