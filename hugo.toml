baseURL = 'https://federico-zanca.github.io/'
locale = 'en-us'
title = 'Federico Zanca'
theme = 'forge'
enableRobotsTXT = true

[params]
  header_name = 'amuro'
  description = 'Notes on systems, security, and kernel internals.'
  # Select the forge theme colors; see README.md for all palettes.
  forge_palette = 'mono'
  # These options apply to the original research theme only.
  article_style = 'reader'
#palette = 'ember'
  fonts = 'auto'
  sidebar = true
  toc = true
  numbered = true

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.parser.attribute]
  block = true
[markup.highlight]
  noClasses = false
  lineNos = true
  lineNumbersInTable = false
  tabWidth = 4
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = true

[outputs]
  home = ['HTML', 'RSS']
