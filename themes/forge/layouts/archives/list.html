{{ define "main" }}
<main id="main" class="archive-grid">
  <header class="archive-heading">
    <h1>Blog</h1>
    <p class="page-intro">Posts and writeups, together in one place.</p>
  </header>
  <aside class="archive-aside" aria-label="Filter blog entries">
    <h2>Find an entry</h2>
    <div class="archive-controls">
      <label>Search <input id="archive-search" type="search" placeholder="Search titles" autocomplete="off"></label>
      <label>Tag <select id="archive-tag"><option value="">All tags</option>{{ range site.Taxonomies.tags.Alphabetical }}<option value="{{ .Page.LinkTitle | lower }}">{{ .Page.LinkTitle }}</option>{{ end }}</select></label>
      <label>Type <select id="archive-kind"><option value="">Posts and writeups</option><option value="posts">Posts</option><option value="writeups">Writeups</option></select></label>
    </div>
  </aside>
  <section class="archive-results" aria-label="Blog entries">
    {{ partial "entries.html" (dict "pages" (where site.RegularPages "Section" "in" (slice "posts" "writeups"))) }}
    <p id="empty-results" hidden>No matching writing.</p>
  </section>
</main>
{{ end }}
