<ul class="post-list">{{ range .ByDate.Reverse }}<li data-title="{{ .Title | lower }}" data-tags="{{ .Params.tags | jsonify }}"><time>{{ .Date.Format "2006-01-02" }}</time><div><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<p>{{ . }}</p>{{ end }}<div class="post-tags">{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div></div></li>{{ end }}</ul>
